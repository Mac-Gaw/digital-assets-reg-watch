name: Regulatory Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
    - cron: "47 12 * * *"

permissions:
  contents: write

jobs:
  update-regulatory-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch regulatory feeds
        run: npm run fetch

      - name: Build static data
        run: npm run build:data

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data.js data/*.json
          git diff --cached --quiet && echo "No data changes to commit" && exit 0
          git commit -m "Update regulatory monitoring data"
          git push
