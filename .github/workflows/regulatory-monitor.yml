name: Regulatory monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. Running at both 07:17 and 08:17 UTC lets the
    # script keep the intended 08:xx Europe/London run across BST/GMT changes.
    - cron: "17 7 * * *"
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run scheduled RSS-first regulatory monitor
        if: github.event_name == 'schedule'
        env:
          TARGET_LONDON_HOUR: 8
        run: npm run fetch:scheduled

      - name: Run manual RSS-first regulatory monitor
        if: github.event_name == 'workflow_dispatch'
        run: npm run fetch

      - name: Commit monitoring updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update regulatory monitoring feed"
          file_pattern: "assets/data.js data/*.json logs/*.json"
