name: Events & Briefings Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"
    - cron: "17 13 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Fetch events and briefings
        run: npm run fetch:events

      - name: Build static data
        run: npm run build:data

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data.js data/events.json data/events-sources.registry.json data/metadata.json logs/last-events-scan.json
          git diff --cached --quiet && echo "No event changes to commit" && exit 0
          git commit -m "Update events and briefings"
          git push
