name: Events & Briefings Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"
    - cron: "17 13 * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Fetch events and briefings
        run: npm run fetch:events

      - name: Commit event updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update events and briefings"
          file_pattern: "assets/data.js data/events.json data/events-sources.registry.json data/metadata.json logs/*.json"
